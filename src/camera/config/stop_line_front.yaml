# Existing road-facing front camera, shared with LaneNet, UDP 9291.
# Separate geometry from the former downward-looking Camera-7 calibration.
camera_image_size: [1280, 720]
# Initial ROI based on the saved front frame: road below horizon, above bonnet.
# Order: bottom-left, top-left, top-right, bottom-right. Tune on live stop-line frames.
roi: [[0.27, 0.79], [0.42, 0.58], [0.63, 0.58], [0.76, 0.79]]
bev_size: 320
white_v_min: 165
white_s_max: 80
min_coverage: 0.60
min_band_height: 0.01
# Reject thin markings even when perspective warping makes them look thick.
# Normalized source-image height: 8 pixels / 720 pixels.
min_image_band_height: 0.011111111111111112
max_band_height: 0.09
arrow_stem_min_length: 0.10
crosswalk_min_bands: 3
crosswalk_max_gap: 0.14
# Require two detections in the last three frames to reject transient markings.
confirm_window: 3
confirm_hits: 2
max_y_jump: 0.08
image_timeout: 0.5
# The old camera's correspondences cannot be reused on this camera.
calibration_image_points: []
calibration_ground_points: []
