# MORAI camera mount supplied by the user. Metadata, not assumed ground height.
camera_mount_xyz: [1.9, 0.0, 1.2]
camera_pitch_deg: 12.5
camera_image_size: [640, 480]
camera_horizontal_fov_deg: 90.0

# Corner order: bottom-left, top-left, top-right, bottom-right.
# Tuned on Camera-7 road images: stay inside this lane and above the bonnet.
# The old broad ROI clipped the near stop line and included the distant horizon.
roi: [[0.28, 0.59], [0.45, 0.43], [0.59, 0.43], [0.68, 0.59]]
bev_size: 320
white_v_min: 165
white_s_max: 80
min_coverage: 0.60
min_band_height: 0.01
max_band_height: 0.09
# A transverse branch with a long central vertical stroke is direction-arrow paint.
arrow_stem_min_length: 0.10
crosswalk_min_bands: 3
crosswalk_max_gap: 0.14
confirm_window: 5
confirm_hits: 3
max_y_jump: 0.08
image_timeout: 0.5

# Keep empty until measured correspondences are available. No guessed metre output.
# Image points: four normalized coordinates in boundary order.
# Ground points: corresponding [forward_m, left_m] from the front bumper's ground projection.
calibration_image_points: []
calibration_ground_points: []
