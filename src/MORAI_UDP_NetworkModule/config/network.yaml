# Actual MORAI Network Settings
#
# MORAI PC       : 192.168.0.14
# Algorithm PC   : 192.168.0.8
#
# Network Settings:
# Ego Ctrl Cmd               User -> Sim : host 9093 / destination 9094
# Collision Data             Sim -> User : host 9091 / destination 9092
# Competition Vehicle Status Sim -> User : host 9088 / destination 9099
# Ego Vehicle Status         Sim -> User : host 9100 / destination 9111
# Object Info                Sim -> User : host 7605 / destination 7505
# Scenario Load                          : host 9095 / destination 9096
# Sensor Sync Data                       : host 9097 / destination 9098
# Set TrafficLight Ctrl                  : host 7607 / destination 7503

control:
  max_steering_deg: 40.0

# Current ROS vehicle-status node parses EgoVehicleStatus,
# so receive Ego Vehicle Status on the user-side destination port.
vehicle_status_publisher:
  port: 9111
  timeout: 0.5
  header: "#MoraiInfo$"

# User -> Sim
# Send Ego Ctrl Cmd to the MORAI host port.
morai_cmd_controller:
  port: 9093
  source_port: 9094
  send_hz: 50.0
  command_timeout: 0.3
  status_timeout: 0.5

# Stored for later implementation/verification.
competition_vehicle_status:
  host_port: 9088
  destination_port: 9099

collision_data:
  host_port: 9091
  destination_port: 9092

object_info:
  host_port: 7605
  destination_port: 7505

scenario_load:
  host_port: 9095
  destination_port: 9096

sensor_sync_data:
  host_port: 9097
  destination_port: 9098

set_trafficlight_ctrl:
  host_port: 7607
  destination_port: 7503

# Sensor ports below are NOT part of the Network Setting values
# confirmed above. Keep only after verifying the actual MORAI sensor settings.

gps_udp:
  kind: gps
  port: 1111
  topic: /gps
  frame_id: gps
  timeout: 0.5
  east_offset: 302595.0
  north_offset: 4124145.0

imu_udp:
  kind: imu
  port: 1112
  topic: /imu
  frame_id: imu
  timeout: 0.5
  layout: timestamped_115

camera_front_udp:
  kind: camera
  port: 9291
  topic: /camera/front/image/compressed
  frame_id: camera_front
  timeout: 0.5

camera_left_udp:
  kind: camera
  port: 9293
  topic: /camera/left/image/compressed
  frame_id: camera_left
  timeout: 0.5

camera_right_udp:
  kind: camera
  port: 9295
  topic: /camera/right/image/compressed
  frame_id: camera_right
  timeout: 0.5